<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Bosančica Translater By Neo Rafajlović</title>
		<style>
* {
  font-family: "Calibri", "Comic Sans MS", "Comic Sans", "Calibri", "Arial", sans-serif;
  margin: 0;
  padding: 0;
}
body {
  background-color: rgb(50, 50, 50);
  display: flex;
  justify-content: center;
  width: 100vw;
}
h1 {
  color: white;
}
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
}
#input-div {
  display: block;
}
#in-out-div {
  display: flex;
  flex-direction: column;
  align-items: center;
}
#input {
  width: 40vw;
  max-width: 500px;
  height: 70vh;
  max-height: 700px;
  margin-bottom: 10px;
  margin-right: 0;
  resize: none;
  padding: 5px;
}
#font-size-label {
  color: white;
}
#font-size-display {
  color: white;
}
#output-p {
  background-color: white;
  width: 40vw;
  max-width: 500px;
  min-height: 500px;
  height: 70vh;
  max-height: 700px;
  border: 2px solid black;
  color: rgb(24, 22, 27);
  font-size: 20px;
  font-weight: 800;
  padding: 30px;
  word-wrap: break-word;
  overflow-wrap: break-word;
  text-align: justify;
  text-justify: inter-character;
  letter-spacing: 3px;
  line-height: 1;
}
.custom-overline {
  position: relative;
  display: inline-block;
  margin-top: 5px;
  padding-top: 2px;
}
.custom-overline::before {
  content: "";
  position: absolute;
  top: 5px;
  left: 0;
  width: 100%;
  border-top: 2px solid black;
}
		</style>
	</head>
	<body>
		<div class="container">
			<h1>Bosančica Translater By Neo Rafajlović</h1>
			<div id="in-out-div">
				<div id="input-div">
					<label for="font-size" id="font-size-label">Size:</label>
					<input
						type="range"
						name="font-size"
						id="font-size"
						min="5"
						max="100"
						value="20"
						step="1"
					>
					<span id="font-size-display">20px</span>
					<br>
					<textarea
						id="input"
						placeholder="Input..."
					></textarea>
				</div>
				<p id="output-p">
					<span id="output"></span>
				</p>
			</div>
			<a href="./index.html" download>
				<button>Download Offline Version</button>
			</a>
		</div>
		<script>
const bosancica = {
  "\n": ":",
  ".\n": ":",
  " ": "",
  ",": "•",
  ";": "•",
  "?": ":",
  "!": ":",
  ".": ":",
  "1": "ʠ",
  "2": "в",
  "3": "ґ",
  "4": "A",
  "5": "є",
  "6": "ꙅ",
  "7": "ȝ",
  "8": "н",
  "9": "ѳ",
  "0": "O",
  "a": "ʠ",
  "b": "б",
  "c": "ц",
  "č": "v",
  "ć": "Ꙉ",
  "ćt": "щ",
  "d": "A",
  "dž": "ꙅ",
  "đ": "Ꙉ",
  "e": "є",
  "f": "Ф",
  "g": "г",
  "h": "х",
  "i": "н",
  "ja": "ѣ",
  "je": "ƀ",
  "ju": "ю",
  "ji": "н",
  "j": "н",
  "k": "к",
  "l": "Λ",
  "lj": "ꙈΛ",
  "m": "м",
  "n": "ɴ",
  "nj": "Ꙉɴ",
  "o": "о",
  "od": "ɯ",
  "ot": "ɯ",
  "p": "π",
  "r": "р",
  "s": "с",
  "š": "ш",
  "šć": "щ",
  "št": "щ",
  "t": "т",
  "u": "ꙋ",
  "v": "в",
  "z": "ȝ",
  "ž": "ⵣ",
  "'": "ь",
  "y": "ы"
};
const input = document.getElementById("input");
const outputSpan = document.getElementById("output");
input.addEventListener("input", (e) => {
  let output = "";
  let done = 0;
  const value = input.value.toLowerCase();
  while (done < value.length) {
    let matched = false;
    for (let i = value.length - done; i > 0; i--) {
      let part = value.slice(done, done + i);
      if (part in bosancica) {
        output += bosancica[part];
        done += part.length;
        matched = true;
        break;
      }
    }
    if (!matched) {
      output += value[done];
      done++;
    }
  }
  outputSpan.innerHTML = output;
});
const fontSize = document.getElementById("font-size");
fontSize.addEventListener("input", (e) => {
  let output = `${fontSize.value}px`;
  outputSpan.style.fontSize = output;
  document.getElementById("font-size-display").innerHTML = output;
});
		</script>
	</body>
</html>
